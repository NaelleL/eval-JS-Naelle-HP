<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/style.css" />
    <title>Naëlle Lemennicier - Partiel Harry Potter</title>
  </head>
  <body>
    <main>
      <header class="header">
        <div class="header__right">
          <img src="../images/logo.png" />
        </div>
        <div class="header__left">
          <h1>Naëlle Lemennicier - Wiki Harry Potter</h1>
          <img src="../images/menu.png" alt="Menu" srcset="" />
        </div>
      </header>
      <section>
        <h3>HOUSES</h3>
        <div class="houses">
          <img src="../images/Gryffindor.png" alt="Gryffindor" />
          <img src="../images/Hufflepuff.png" alt="Hufflepuff" />
          <img src="../images/Ravenclaw.png" alt="Ravenclaw" />
          <img src="../images/Slytherin.png" alt="Slytherin" />
        </div>
      </section>
      <section>
        <h3>Characters</h3>
        <div class="characters">
          <div class="character">
            <img src="../images/harry.webp" alt="Harry Potter" />
            <p>Harry <br> Potter</p>
          </div>
          <div class="character">
            <img src="../images/hermione.webp" alt="Hermione Granger" />
            <p>Hermione <br> Granger</p>
          </div>
          <div class="character">
            <img src="../images/ron.webp" alt="Ron Weasley" />
            <p>Ron <br> Weasley</p>
          </div>  
        <div class="character">
            <img src="../images/draco.webp" alt="Draco Malfoy" />
            <p>Draco <br> Malfoy</p>
          </div>
          <div class="character">
            <img src="../images/cho.webp" alt="Cho Chang" />
            <p>Cho <br> Chang</p>
          </div>
          <div class="character">
            <img src="../images/snape.webp" alt="Severus Snape" />
            <p>Severus <br> Snape</p>
          </div>
          <div class="character">
            <img src="../images/mcgonagall.webp" alt="Minerva McGonagall" />
            <p>Minerva <br> McGonagall</p>
          </div>
          <div class="character">
            <img src="../images/cedric.webp" alt="Cedric Diggory" />
            <p>Cedric <br> Diggory</p>
          </div>
        </div>
      </section>
    </main>
    <footer>
      <p>Wiki Happy Potter is a FANDOM community</p>
    </footer>
  </body>
</html>
